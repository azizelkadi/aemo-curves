[project]
name = "aemo-curves"
version = "0.1.0"
description = "Predicting supply and demand curves of the Australian STEM electricity market"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.12",
    "pyarrow>=15",
    "tqdm>=4.66",
    "typer>=0.12",
    "rich>=13.7",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "ipykernel>=7.2.0",
    "dtaidistance>=2.3",
    "scikit-learn-extra>=0.3",
    "torch>=2.2",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
aemo-run = "aemo_curves.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aemo_curves"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
