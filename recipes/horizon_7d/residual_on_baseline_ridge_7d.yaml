name: horizon_7d.residual_on_baseline_ridge_7d
description: Ridge residual on the lag-7 baseline.
data:
  side: demand
  features: interp
  split: canonical
  lag_days: 7
predict:
  strategy: residual_on_baseline
  params:
    lags:
    - 7
    - 8
    - 14
    - 21
    n_pca_x: 10
    n_pca_y: 3
    shrinkage: 0.1
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: Ridge residual on the lag-7 baseline.
