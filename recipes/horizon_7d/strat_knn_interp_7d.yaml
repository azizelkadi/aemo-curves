name: horizon_7d.strat_knn_interp_7d
description: Stratified k=1 ridge retrieval at lag-7.
data:
  side: demand
  features: interp
  split: canonical
  lag_days: 7
predict:
  strategy: stratified_knn
  params:
    k: 1
    query: ridge
    bucket: interval_dow
    ridge_alpha: 200.0
    ridge_n_pca: 20
    ridge_lags:
    - 7
    lag_days: 7
    output_mode: top1_curve
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: Stratified k=1 ridge retrieval at lag-7.
