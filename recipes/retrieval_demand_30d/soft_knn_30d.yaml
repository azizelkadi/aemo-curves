name: retrieval_demand_30d.soft_knn_30d
description: Soft k-NN at lag-30.
data:
  side: demand
  features: interp
  split: canonical
  lag_days: 30
predict:
  strategy: soft_knn
  params:
    k: 1
    lag_days: 30
    ridge_alpha: 2.0
    ridge_n_pca: 20
    ridge_lags:
    - 30
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 30
notes: Soft k-NN at lag-30.
