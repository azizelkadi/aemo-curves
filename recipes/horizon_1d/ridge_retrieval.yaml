name: horizon_1d.ridge_retrieval
description: Per-interval Ridge on lagged embeddings, mapped to the nearest curve.
data:
  side: supply
  features: interp
  split: canonical
  lag_days: 1
predict:
  strategy: ridge_retrieval
  params:
    lags:
    - 1
    - 2
    - 7
    - 14
    alpha: 2.0
    n_pca: 20
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Per-interval Ridge on lagged embeddings, mapped to the nearest curve.
