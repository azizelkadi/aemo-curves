name: horizon_1d.residual_on_baseline_ridge
description: Ridge residual interpolated onto the lag-1 step positions.
data:
  side: supply
  features: interp
  split: canonical
  lag_days: 1
predict:
  strategy: residual_on_baseline
  params:
    lags:
    - 1
    - 2
    - 7
    - 14
    n_pca_x: 10
    n_pca_y: 3
    shrinkage: 0.1
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Ridge residual interpolated onto the lag-1 step positions.
