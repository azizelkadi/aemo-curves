name: horizon_1d.fof_snap_1d
description: Function-on-function snap predictor.
data:
  side: demand
  features: interp
  split: canonical
  lag_days: 1
predict:
  strategy: fof_snap
  params:
    lags:
    - 1
    - 2
    - 7
    use_calendar: true
    min_samples: 20
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Function-on-function snap predictor.
