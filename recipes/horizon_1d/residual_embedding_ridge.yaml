name: horizon_1d.residual_embedding_ridge
description: Ridge residual corrector in embedding space.
data:
  side: supply
  features: interp
  split: canonical
  lag_days: 1
predict:
  strategy: residual_embedding
  params:
    lags:
    - 1
    - 2
    - 7
    - 14
    n_pca_x: 20
    n_pca_y: 10
    shrinkage: 1.0
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Ridge residual corrector in embedding space.
