name: recompute_2024test.exp2_rolling_ridge
description: Rolling ridge on the 2024 recut.
data:
  side: demand
  features: interp
  split: user2024
  lag_days: 30
predict:
  strategy: rolling_refit
  params:
    query: ridge
    ridge_alpha: 200.0
    ridge_n_pca: 20
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 30
notes: Rolling ridge on the 2024 recut.
