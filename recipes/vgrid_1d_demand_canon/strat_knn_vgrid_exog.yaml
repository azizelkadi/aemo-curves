name: vgrid_1d_demand_canon.strat_knn_vgrid_exog
description: Static stratified k=1 ridge retrieval on v_grid at lag-1.
data:
  side: demand
  features: v_grid
  split: canonical
  lag_days: 1
predict:
  strategy: static_retrieval
  params:
    query: ridge
    ridge_alpha: 200.0
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Static stratified k=1 ridge retrieval on v_grid at lag-1.
params:
  exog:
    sources:
    - proxy
    - weather
