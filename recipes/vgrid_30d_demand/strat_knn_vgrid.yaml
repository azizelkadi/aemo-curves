name: vgrid_30d_demand.strat_knn_vgrid
description: Static stratified k=1 ridge retrieval on v_grid at lag-30.
data:
  side: demand
  features: v_grid
  split: canonical
  lag_days: 30
predict:
  strategy: static_retrieval
  params:
    query: ridge
    ridge_alpha: 200.0
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 30
notes: Static stratified k=1 ridge retrieval on v_grid at lag-30.
