name: retrieval_demand_30d_rolling.B_rolling_ridge
description: Monthly rolling refit, ridge query, lag-30.
data:
  side: demand
  features: interp
  split: canonical
  lag_days: 30
predict:
  strategy: rolling_refit
  params:
    query: ridge
    ridge_alpha: 200.0
    ridge_n_pca: 20
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 30
notes: Monthly rolling refit, ridge query, lag-30.
