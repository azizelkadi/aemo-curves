name: vgrid_1d_demand.rolling_ridge_interp
description: Rolling ridge on interp (comparator).
data:
  side: demand
  features: interp
  split: user2024
  lag_days: 1
predict:
  strategy: rolling_refit
  params:
    query: ridge
    ridge_alpha: 200.0
    ridge_n_pca: 20
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Rolling ridge on interp (comparator).
