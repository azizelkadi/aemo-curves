name: vgrid_1d_demand.rolling_oracle_vgrid
description: Rolling refit k=1 oracle on v_grid at lag-1.
data:
  side: demand
  features: v_grid
  split: user2024
  lag_days: 1
predict:
  strategy: rolling_refit
  params:
    query: oracle
    ridge_alpha: 200.0
    ridge_n_pca: 20
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Rolling refit k=1 oracle on v_grid at lag-1.
