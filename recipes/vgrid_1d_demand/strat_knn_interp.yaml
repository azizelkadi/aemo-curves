name: vgrid_1d_demand.strat_knn_interp
description: Static ridge retrieval on interp (comparator).
data:
  side: demand
  features: interp
  split: user2024
  lag_days: 1
predict:
  strategy: static_retrieval
  params:
    query: ridge
    ridge_alpha: 200.0
evaluate:
