name: retrieval_demand_1d.soft_knn
description: Soft k-NN over the global per-interval library.
data:
  side: demand
  features: interp
  split: canonical
  lag_days: 1
predict:
  strategy: soft_knn
  params:
    k: 10
evaluate:
  metric: wasserstein
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Soft k-NN over the global per-interval library.
