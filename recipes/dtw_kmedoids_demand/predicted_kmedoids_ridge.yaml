name: dtw_kmedoids_demand.predicted_kmedoids_ridge
description: Ridge predicts the K-vector; closest predicted medoid.
data:
  side: demand
  features: kmedoids
  split: canonical
  k: 24
  lag_days: 1
predict:
  strategy: dtw_predicted
  params:
    query: ridge
    alpha: 5.0
evaluate:
  metric: dtw
  baseline:
    strategy: lag1
    params:
      lag_days: 1
notes: Ridge predicts the K-vector; closest predicted medoid.
