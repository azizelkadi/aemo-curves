# Perfect-weather CEILING (demand). rolling_ridge plus exogenous features:
# market-state proxy (shifted by the 7-day horizon) + the ACTUAL same-day Perth
# weather with NO noise. This is an ORACLE upper bound on what weather could ever
# buy - it is NOT deployable (a real 7-day-ahead model cannot know the target
# day's actual weather).
#
# Scored under HC-MAE (lower is better) vs the lag-7 baseline on the canonical split.

name: demand.7d.hc_mae.vgrid.rolling_ridge_exog_wactual
description: 'v_grid retrieval, rolling ridge refit, with proxy and the perfect actual
  same-day weather (no noise) as a ceiling oracle.'
data:
  side: demand
  features: v_grid
  split: canonical
  lag_days: 7
predict:
  strategy: rolling_refit
  params:
    query: ridge
    ridge_alpha: 200.0
    ridge_n_pca: 20
evaluate:
  metric: hc_mae
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: 'ORACLE/ceiling: uses actual same-day weather, not deployable. Upper bound on
  what any weather signal could buy for demand; the weather_fc forecast run is measured
  against this gap.'
params:
  exog:
    sources:
    - proxy
    - weather_actual
