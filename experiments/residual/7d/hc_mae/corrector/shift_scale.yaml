# Baseline corrector (shift + scale). Like shift, but also predicts a log quantity
# scale, so the lag-7 curve is both translated in price and stretched/squeezed in
# quantity. On the residual (demand-minus-supply price spread) curve.
#
# Scored under HC-MAE (lower is better) vs the lag-7 baseline on the canonical split.

name: residual.7d.hc_mae.corrector.shift_scale
description: Per-interval ridge predicts (price shift, log quantity scale) for the lag-7
  residual (demand-minus-supply price spread) curve.
data:
  side: residual
  features: interp
  split: canonical
  lag_days: 7
predict:
  strategy: shift_scale_corrector
  params:
    lags:
    - 7
    - 14
    - 21
    - 28
    alpha: 5.0
evaluate:
  metric: hc_mae
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: Adds a quantity-axis scale to the shift corrector, on the residual (demand-minus-supply
  price spread) curve.
