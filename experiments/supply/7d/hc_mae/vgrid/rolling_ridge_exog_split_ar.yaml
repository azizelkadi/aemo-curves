# AUTOREGRESSIVE (supply). The best feature-based vgrid model `rolling_ridge_exog_split`
# (split-PCA, proxy + weather, HC-MAE ~67.2, best feature model on the live leaderboard)
# plus the model's OWN predictions for the future gap days D-1, D-2, D-3 as extra features.
# Those days have not happened yet at the forecast origin (D-7), so their curves must be
# predictions (a walk-forward backfill of the base model), not real data. Two-stage
# stacking; leakage-safe (each pred(D-k) uses only data <= D-k-7). NOTE: on supply nothing
# (this base included) beats the lag-7 baseline; this measures AR vs its own base. See
# src/aemo_curves/stages/predict/autoregressive.py.
#
# Scored under HC-MAE (lower is better) vs the lag-7 baseline on the canonical split.

name: supply.7d.hc_mae.vgrid.rolling_ridge_exog_split_ar
description: 'Autoregressive: split-PCA base + self-predictions for D-1..D-3 (8 block-means/lag).'
data:
  side: supply
  features: v_grid
  split: canonical
  lag_days: 7
predict:
  strategy: rolling_refit_ar
  params:
    query: ridge
    ridge_alpha: 200.0
    ridge_n_pca: 20
    pca_mode: split
    self_pred_lags: [1, 2, 3]
    self_pred_blocks: 8
evaluate:
  metric: hc_mae
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: 'Autoregressive: split-PCA base + self-predictions for D-1..D-3 (8 block-means/lag).'
params:
  exog:
    sources:
    - proxy
    - weather
