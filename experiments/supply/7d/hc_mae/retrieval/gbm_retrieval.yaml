# Retrieval with a nonlinear query. A per-interval HistGradientBoosting model predicts
# the embedding from lag-7 features, then the nearest real training curve (L2 in
# embedding space) is returned. (Slow to fit on supply.)
#
# Scored under HC-MAE (lower is better) vs the lag-7 baseline on the canonical split.

name: supply.7d.hc_mae.retrieval.gbm_retrieval
description: Plain L2 retrieval with a HistGBM query model (lag-7 features).
data:
  side: supply
  features: interp
  split: canonical
  lag_days: 7
predict:
  strategy: gbm_retrieval
  params:
    lags:
    - 7
evaluate:
  metric: hc_mae
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: Nonlinear query-model alternative to the wired ridge retrieval.