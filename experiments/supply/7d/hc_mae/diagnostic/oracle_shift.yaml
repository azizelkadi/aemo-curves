# DIAGNOSTIC ceiling (not deployable). Applies the median-optimal price translation of
# the lag-7 curve using the TRUE curve - the most any shift-only correction could buy.
# On supply this barely dips below baseline, showing there is no shift headroom there.
#
# Scored under HC-MAE (lower is better) vs the lag-7 baseline on the canonical split.

name: supply.7d.hc_mae.diagnostic.oracle_shift
description: 'Diagnostic ceiling: median-optimal translation of the lag-7 curve (uses true data).'
data:
  side: supply
  features: interp
  split: canonical
  lag_days: 7
predict:
  strategy: oracle_shift
  params:
    base_lag: 7
evaluate:
  metric: hc_mae
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: Upper bound on what any shift-only corrector can achieve. Not deployable.