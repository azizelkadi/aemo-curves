name: demand_7d.vgrid_strat_knn
description: v_grid retrieval, static k=1 ridge query (fit once on train).
data:
  side: demand
  features: v_grid
  split: canonical
  lag_days: 7
predict:
  strategy: static_retrieval
  params:
    query: ridge
    ridge_alpha: 200.0
evaluate:
  metric: hc_mae
  baseline:
    strategy: lag1
    params:
      lag_days: 7
notes: v_grid retrieval, static k=1 ridge query (fit once on train).
