# Publishes the static results site in report/ to GitHub Pages.
# The site is built locally with scripts/build_static_site.py, because the build reads
# artifacts/ (git-ignored), so this workflow uploads the committed report/ folder as it is.
name: Deploy report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "report/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report
      - id: deployment
        uses: actions/deploy-pages@v4
